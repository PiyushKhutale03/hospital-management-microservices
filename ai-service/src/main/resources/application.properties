spring.application.name=ai-service
server.port=8083
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
jwt.secretKey=${JWT_SECRET_KEY:hospitalManagementSecretKeyPiyush12345678901234}

# Google Gemini AI configuration (OpenAI-compatible endpoint)
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.api-key=${GEMINI_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-3.7-flash}